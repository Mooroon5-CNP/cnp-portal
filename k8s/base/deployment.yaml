apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnp-portal
  labels:
    app.kubernetes.io/name: "cnp-portal"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/owner: "team-cnp"
    cost-center: "projet-epita"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cnp-portal
  # Start the new pod before stopping the old one. The SQLite volume is
  # ReadWriteOnce, so the podAffinity below keeps the surge pod on the node
  # that already has the disk attached; both processes share the WAL-mode
  # database for the few seconds of overlap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "cnp-portal"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/owner: "team-cnp"
        cost-center: "projet-epita"
        tags.datadoghq.com/env: "dev"
        tags.datadoghq.com/service: "cnp-portal"
        tags.datadoghq.com/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cnp-portal
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cnp-portal
          image: europe-west9-docker.pkg.dev/cnp-terraform-500015-508716/cnp-registry/cnp-portal:1.0.0
          imagePullPolicy: Always
          lifecycle:
            preStop:
              # Let the ingress drop this endpoint before SIGTERM.
              exec:
                command: [sleep, "5"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: cnp-portal-cloud-env
            - secretRef:
                name: cnp-portal-app-env
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_PATH
              value: /app/data/cnp-portal.sqlite
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: cnp-portal-data
