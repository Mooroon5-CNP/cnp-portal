apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnp-portal-data
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    app.kubernetes.io/name: cnp-portal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi
