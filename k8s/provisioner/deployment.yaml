apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-runtime-provisioner
  namespace: cnp-portal
spec:
  replicas: 1
  # Stateless: start the new pod before stopping the old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-runtime-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-runtime-provisioner
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: openbao-runtime-provisioner
    spec:
      serviceAccountName: openbao-runtime-provisioner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: provisioner
          image: europe-west9-docker.pkg.dev/cnp-terraform-512313/cnp-registry/cnp-portal@sha256:8dedc83b82b6c901b23d679c243399c887f1a7c67ea31e8ddaea18c3f46bcffc
          imagePullPolicy: Always
          command: [node, src/services/openbao-runtime-provisioner-server.js]
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: GCP_PROJECT
              value: cnp-terraform-515922
            - name: CNP_GCP_CROSSPLANE_SA
              value: crossplane-gcp-sa@cnp-terraform-515922.iam.gserviceaccount.com
            - name: AZURE_SUBSCRIPTION_ID
              value: 8e885538-8edd-4dd1-8e3c-64f1ae5ebc1e
            - name: AZURE_LOCATION
              value: francecentral
            # Dedicated group for app runtime identities and vaults: Crossplane may attach only these identities
            # (Managed Identity Operator on this group), never the platform identities of cnp-sov-shared-rg.
            - name: CNP_AZURE_RUNTIME_RESOURCE_GROUP
              value: cnp-sov-runtime-rg
            - name: CNP_AZURE_TENANT_ID
              value: 17c98ba4-ddf8-454c-ba05-95d5326dcf56
            # Libération du nom public avant suppression d'une app Azure (azure-app-domain.js).
            - name: CNP_AZURE_APPS_ENVIRONMENT_ID
              value: /subscriptions/8e885538-8edd-4dd1-8e3c-64f1ae5ebc1e/resourceGroups/cnp-sov-fr-rg/providers/Microsoft.App/managedEnvironments/cnp-sov-fr-cae
            - name: AZURE_PUBLIC_DOMAIN
              value: eu.mooroon5.fr
            - name: CNP_AZURE_PROVISIONER_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cnp-openbao-provisioner-azure
                  key: clientId
            - name: CNP_AZURE_PORTAL_PRINCIPAL_ID
              valueFrom:
                configMapKeyRef:
                  name: cnp-openbao-provisioner-azure
                  key: portalPrincipalId
            - name: CNP_AZURE_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/azure/tokens/azure-identity-token
            # Secours AWS : rôle cnp-openbao-provisioner par OIDC GKE (cnp/aws/20), aucune clé. Valeurs non secrètes.
            - name: CNP_AWS_ACCOUNT_ID
              value: "626278345026"
            - name: CNP_AWS_REGION
              value: eu-west-3
            - name: CNP_AWS_RUNTIME_BOUNDARY_ARN
              value: arn:aws:iam::626278345026:policy/cnp-runtime/cnp-runtime-exec-boundary
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::626278345026:role/cnp-openbao-provisioner
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/aws/tokens/token
            - name: AWS_REGION
              value: eu-west-3
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
          volumeMounts:
            - name: azure-federated-token
              mountPath: /var/run/secrets/azure/tokens
              readOnly: true
            - name: aws-web-identity-token
              mountPath: /var/run/secrets/aws/tokens
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
      volumes:
        - name: azure-federated-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: azure-identity-token
        - name: aws-web-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
