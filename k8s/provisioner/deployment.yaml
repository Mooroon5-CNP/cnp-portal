apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-runtime-provisioner
  namespace: cnp-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-runtime-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-runtime-provisioner
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: openbao-runtime-provisioner
    spec:
      serviceAccountName: openbao-runtime-provisioner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: provisioner
          image: europe-west9-docker.pkg.dev/cnp-terraform-512313/cnp-registry/cnp-portal@sha256:498298ed2d7dd09d64d21a59a27f37d21d24087b0412be6b388842f5c1f1d4a6
          imagePullPolicy: Always
          command: [node, src/services/openbao-runtime-provisioner-server.js]
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: GCP_PROJECT
              value: cnp-terraform-512313
            - name: CNP_GCP_CROSSPLANE_SA
              value: crossplane-gcp-sa@cnp-terraform-512313.iam.gserviceaccount.com
            - name: AZURE_SUBSCRIPTION_ID
              value: 8e885538-8edd-4dd1-8e3c-64f1ae5ebc1e
            - name: AZURE_LOCATION
              value: francecentral
            - name: CNP_AZURE_RUNTIME_RESOURCE_GROUP
              value: cnp-sov-shared-rg
            - name: CNP_AZURE_TENANT_ID
              value: 17c98ba4-ddf8-454c-ba05-95d5326dcf56
            - name: CNP_AZURE_PROVISIONER_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cnp-openbao-provisioner-azure
                  key: clientId
            - name: CNP_AZURE_PORTAL_PRINCIPAL_ID
              valueFrom:
                configMapKeyRef:
                  name: cnp-openbao-provisioner-azure
                  key: portalPrincipalId
            - name: CNP_AZURE_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/azure/tokens/azure-identity-token
          volumeMounts:
            - name: azure-federated-token
              mountPath: /var/run/secrets/azure/tokens
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
      volumes:
        - name: azure-federated-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: azure-identity-token
