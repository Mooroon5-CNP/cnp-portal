apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cnp-portal

resources:
  - ../../base
  - azure-platform-config.yaml
  - azure-openbao-identity.yaml
  - ../../provisioner

patches:
  - target:
      kind: Deployment
      name: cnp-portal
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cnp-portal
      spec:
        template:
          spec:
            volumes:
              - name: openbao-provisioner-token
                projected:
                  sources:
                    - serviceAccountToken:
                        audience: cnp-runtime-provisioner
                        expirationSeconds: 600
                        path: token
              # Identité AWS du portail (Secrets Manager du secours, opérations failover) : rôle cnp-portal-gke par
              # OIDC GKE (cnp/aws/20), aucune clé. Jamais les identifiants de Crossplane.
              - name: aws-web-identity-token
                projected:
                  sources:
                    - serviceAccountToken:
                        audience: sts.amazonaws.com
                        expirationSeconds: 3600
                        path: token
            containers:
              - name: cnp-portal
                env:
                  - name: CNP_OPENBAO_RUNTIME_PROVISIONER_ADDR
                    value: http://openbao-runtime-provisioner.cnp-portal.svc:3001
                  - name: CNP_OPENBAO_RUNTIME_PROVISIONER_TOKEN_FILE
                    value: /var/run/secrets/openbao-provisioner/token
                  - name: AWS_ROLE_ARN
                    value: arn:aws:iam::626278345026:role/cnp-portal-gke
                  - name: AWS_WEB_IDENTITY_TOKEN_FILE
                    value: /var/run/secrets/aws/tokens/token
                  - name: AWS_REGION
                    value: eu-west-3
                  - name: AWS_STS_REGIONAL_ENDPOINTS
                    value: regional
                volumeMounts:
                  - name: openbao-provisioner-token
                    mountPath: /var/run/secrets/openbao-provisioner
                    readOnly: true
                  - name: aws-web-identity-token
                    mountPath: /var/run/secrets/aws/tokens
                    readOnly: true
  - target:
      kind: Deployment
      name: cnp-portal
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: europe-west9-docker.pkg.dev/cnp-terraform-512313/cnp-registry/cnp-portal@sha256:fe6bab514eb53b66167e5a9fd108790224e8ef6e73a8dce6b289119cc70ee074
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1env
        value: "prod"
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "production"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "3000"
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value: {configMapRef: {name: cnp-portal-azure-platform}}
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: cnp-portal
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: openbao-ca, configMap: {name: openbao-ca}}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: azure-federated-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: azure-identity-token
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: openbao-ca, mountPath: /etc/openbao-ca, readOnly: true}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: azure-federated-token, mountPath: /var/run/secrets/azure/tokens, readOnly: true}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_GCP_ADDR, value: "https://openbao.openbao.svc:8200"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_GCP_AUDIENCE, value: "https://openbao.openbao.svc:8200"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_GCP_ROLE, value: "cnp-control"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_GCP_MOUNT, value: "cnp-runtime"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_GCP_CA_FILE, value: "/etc/openbao-ca/ca.crt"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_AZURE_ADDR, value: "https://cnpob8e885538.francecentral.cloudapp.azure.com"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_AZURE_AUDIENCE, value: "https://cnpob8e885538.francecentral.cloudapp.azure.com"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_AZURE_ROLE, value: "cnp-control"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_AZURE_MOUNT, value: "cnp-runtime"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_AZURE_TENANT_ID, value: "17c98ba4-ddf8-454c-ba05-95d5326dcf56"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: AZURE_SUBSCRIPTION_ID, value: "8e885538-8edd-4dd1-8e3c-64f1ae5ebc1e"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_AZURE_RUNTIME_RESOURCE_GROUP, value: "cnp-sov-shared-rg"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_AZURE_FEDERATED_TOKEN_FILE, value: "/var/run/secrets/azure/tokens/azure-identity-token"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CNP_AZURE_PORTAL_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: cnp-openbao-azure-identity
              key: clientId
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_PRIVATE_ADDR, value: "https://openbao.prive.apps.mooroon5.fr:8200"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_PRIVATE_AUDIENCE, value: "https://openbao.prive.apps.mooroon5.fr:8200"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_PRIVATE_ROLE, value: "cnp-control"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_PRIVATE_MOUNT, value: "cnp-runtime"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PRIVATE_APPS_DOMAIN, value: "prive.apps.mooroon5.fr"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PRIVATE_ECR_REGISTRY, value: "626278345026.dkr.ecr.eu-west-3.amazonaws.com"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PRIVATE_PROVIDER_CONFIG, value: "cnp-prive"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PRIVATE_CERT_ISSUER, value: "letsencrypt-prod"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_AWS_ADDR, value: "https://openbao-aws.apps.mooroon5.fr:8200"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_AWS_AUDIENCE, value: "https://openbao-aws.apps.mooroon5.fr:8200"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_AWS_ROLE, value: "cnp-control"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_OPENBAO_AWS_MOUNT, value: "cnp-runtime"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_AWS_ACCOUNT_ID, value: "626278345026"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CNP_AWS_REGION, value: "eu-west-3"}
  - target:
      kind: Ingress
      name: cnp-portal
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: portal.apps.mooroon5.fr
      - op: replace
        path: /spec/rules/0/host
        value: portal.apps.mooroon5.fr
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod

