apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cnp-portal

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: cnp-portal
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: registry.gitlab.com/cnp/cnp-portal:1.0.0
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1env
        value: "prod"
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "production"
  - target:
      kind: Ingress
      name: cnp-portal
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: cnp-portal.example.com
      - op: replace
        path: /spec/rules/0/host
        value: cnp-portal.example.com
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
  - target:
      kind: Deployment
      name: cnp-portal
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "INFO"

images:
  - name: registry.gitlab.com/cnp/cnp-portal
    newTag: "1.0.0"
