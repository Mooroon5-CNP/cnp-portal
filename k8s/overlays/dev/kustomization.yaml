apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cnp-portal

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: cnp-portal
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: europe-west9-docker.pkg.dev/cnp-terraform-500015-508716/cnp-registry/cnp-portal:latest
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1env
        value: "dev"
  - target:
      kind: Ingress
      name: cnp-portal
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: cnp-portal.dev.example.com
      - op: replace
        path: /spec/rules/0/host
        value: cnp-portal.dev.example.com
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging

images:
  - name: europe-west9-docker.pkg.dev/cnp-terraform-500015-508716/cnp-registry/cnp-portal
    newTag: latest
