name: Portal validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/deployment-environment-selection, feat/failover-phase1]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnp-portal
    steps:
      - uses: actions/checkout@v4
        with:
          path: cnp-portal
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cnp-portal/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r scripts/failover/engine/requirements.platform.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --runInBand
