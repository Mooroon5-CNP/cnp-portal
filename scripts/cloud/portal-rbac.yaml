apiVersion: v1
kind: Namespace
metadata:
  name: cnp-portal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnp-portal
  namespace: cnp-portal
---
apiVersion: v1
kind: Secret
metadata:
  name: cnp-portal-token
  namespace: cnp-portal
  annotations:
    kubernetes.io/service-account.name: cnp-portal
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnp-portal-argocd
  namespace: argocd
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [argocd-cm]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [argocd-secret]
    verbs: [get, patch]
  - apiGroups: [argoproj.io]
    resources: [applicationsets, applications]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnp-portal-argocd
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: cnp-portal
    namespace: cnp-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnp-portal-argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnp-portal-runtime
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get, list, delete]
  - apiGroups: ['']
    resources: [pods, events, resourcequotas, services]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get]
  - apiGroups: [cloudrun.gcp.upbound.io]
    resources: [v2services]
    verbs: [get, list]
  - apiGroups: [apiextensions.crossplane.io]
    resources: [compositeresourcedefinitions]
    verbs: [list]
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnp-portal-runtime
subjects:
  - kind: ServiceAccount
    name: cnp-portal
    namespace: cnp-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnp-portal-runtime
